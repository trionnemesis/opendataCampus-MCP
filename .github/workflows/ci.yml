name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小權限原則（CWE-284 / OWASP CICD-SEC-3）：workflow 只需 checkout 原始碼即可跑測試，
# 明確宣告 read-only；未宣告時會沿用 repository 預設的 GITHUB_TOKEN 權限（可能為 write-all）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # 第三方 action 一律鎖 commit SHA：浮動 tag 可被上游重新指向（供應鏈風險）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 僅跑離線單元測試；live 抓取（integration_e2e / smoke_sources）需連外網，不進 CI gate
      - name: Run unit tests
        run: pytest tests/ -v

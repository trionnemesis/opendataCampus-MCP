name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小權限原則（CWE-284 / OWASP CICD-SEC-3）：workflow 只需 checkout 原始碼即可跑測試，
# 明確宣告 read-only，避免依賴 repo 預設 GITHUB_TOKEN 權限（可能較寬）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 僅跑離線單元測試；live 抓取（integration_e2e / smoke_sources）需連外網，不進 CI gate
      - name: Run unit tests
        run: pytest tests/ -v

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 未宣告時 GITHUB_TOKEN 拿的是 repo 預設權限(舊 repo/org 可能是 write-all)。
# 本 workflow 只需讀原始碼,明確收斂到最小權限。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 僅跑離線單元測試；live 抓取（integration_e2e / smoke_sources）需連外網，不進 CI gate
      - name: Run unit tests
        run: pytest tests/ -v

  sast:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install "bandit>=1.7"

      # -ll = 只讓 Medium 以上失敗;Low 噪音(assert 等)仍列出供人工檢視
      - name: Run bandit
        run: python -m bandit -r src scripts -ll

  audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 的 ensurepip 不再夾帶 setuptools,避免稽核到與本專案無關的 bootstrap 套件
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 無 lockfile,故稽核「實際解析安裝」的版本樹,與執行環境一致
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run pip-audit
        run: python -m pip_audit --progress-spinner off --skip-editable

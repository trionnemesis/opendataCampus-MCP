name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小權限:本 workflow 只需讀取原始碼。未宣告時 GITHUB_TOKEN 會沿用
# repository 預設(可能為 read/write),等於讓任一 job 具備寫入該 repo 的能力。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # 第三方 action 一律釘 commit SHA:tag 可被上游移動,等同可變的
      # 供應鏈輸入(與 g0VMCP 的 CI 對齊)。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 僅跑離線單元測試；live 抓取（integration_e2e / smoke_sources）需連外網，不進 CI gate
      - name: Run unit tests
        run: pytest tests/ -v

  sast:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install "bandit>=1.7"

      # -ll = 只讓 Medium 以上失敗;Low 噪音(assert 等)仍列出供人工檢視
      - name: Run bandit
        run: python -m bandit -r src -ll

  audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 3.12 的 ensurepip 不再夾帶 setuptools,避免稽核到與本專案無關的 bootstrap 套件
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 無 lockfile,故稽核「實際解析安裝」的版本樹,與執行環境一致
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run pip-audit
        run: python -m pip_audit --progress-spinner off --skip-editable

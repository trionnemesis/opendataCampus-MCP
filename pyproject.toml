[project]
name = "opendata-campus-mcp"
version = "0.1.0"
description = "教育資源導航 MCP — 以 TWCampus 作為目錄入口，路由至台灣官方教育平台"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "warden" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # >=3.2.0:低於此版本的 fastmcp 受 PYSEC-2026-2475 / PYSEC-2026-2476 影響
    # (另有 PYSEC-2026-1364/1365、PYSEC-2026-2474、GHSA-rcfx-77hg-w2wv 於更早版本修掉)
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # 台灣政府教育平台憑證部分缺 Subject Key Identifier，改用 OS 系統信任庫驗證
    "truststore>=0.9",
]

[project.optional-dependencies]
headless = ["playwright>=1.44"]
dev = [
    # >=9.0.3:更早的版本受 PYSEC-2026-1845 影響(/tmp/pytest-of-{user} 可預測路徑,
    # 本機使用者可藉此 DoS 或提權)。僅影響開發/CI 環境,不進 runtime 相依。
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
opendata-campus-mcp = "opendata_campus_mcp.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_campus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "opendata-campus-mcp"
version = "0.1.0"
description = "教育資源導航 MCP — 以 TWCampus 作為目錄入口，路由至台灣官方教育平台"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "warden" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # 原下限 >=0.2.0 過寬，全新解析可能裝到已知弱點版本，故收緊。
    # 已於本次以 pip-audit 實測確認：3.1.0 命中 PYSEC-2026-2475 / PYSEC-2026-2476
    # （皆修復於 3.2.0），3.2.0 於同一 advisory DB 已無紀錄。
    # 額外取到 3.2.4 是沿用先前審查記錄的 Authorization header 跨 server 外洩修正；
    # 該項未能在本次離線環境重新查證，僅作為更保守的下限（目前解析到 3.4.x，無實際影響）。
    "fastmcp>=3.2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # 台灣政府教育平台憑證部分缺 Subject Key Identifier，改用 OS 系統信任庫驗證
    "truststore>=0.9",
]

[project.optional-dependencies]
headless = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
opendata-campus-mcp = "opendata_campus_mcp.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_campus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
